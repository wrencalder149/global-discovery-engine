name = "blue-cloud-c7c2"
main = "src/entry.js"
compatibility_date = "2026-09-17"

# Worker name must stay identical to the Cloudflare dashboard project name.

[triggers]
crons = ["0 21 * * *"]

[ai]
binding = "AI"

[[workflows]]
name = "global-discovery-daily"
binding = "DAILY_DISCOVERY"
class_name = "GlobalDiscoveryWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "global-discovery"
database_id = "f9c82884-642f-4697-9435-df0b6d8897bc"
