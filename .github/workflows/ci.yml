name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Worker syntax
        run: |
          node --check src/index.js
          node --check src/entry.js
          node --check src/daily.js
          node --check src/workflow.js

      - name: Check required exports and bindings
        run: node tests/validate-config.mjs

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
